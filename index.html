<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./styles.css">
    <title>Rock paper scissors</title>
</head>
<body>

    <div class="container">
        <!-- Explain the dynamic of the game -->
        <div class="instructions">
            <p>You against the computer, whoever reaches 5 points first will win the game. Click one of the buttons to start the game!</p>
        </div>

        <!-- Buttons to represent choices -->
        <div class="choices">
            <button class="rock">Rock</button>
            <button class="paper">Paper</button>
            <button class="scissors">Scissors</button>
        </div>

        <!-- Current status of the game -->
        <div class="status">
            <p class="user-selection"></p>
            <p class="computer-selection"></p>
            <p class="outcome"></p>
            <p class="user-score"></p>
            <p class="computer-score"></p>
            <p class="winner"></p>
            <p class="post-game"></p>
        </div>
    </div>

</body>
</html>
